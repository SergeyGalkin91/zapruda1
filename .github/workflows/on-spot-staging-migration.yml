name: ON SPOT+ apply reviewed STAGING migration

on:
  pull_request:
    paths:
      - .github/workflows/on-spot-staging-migration.yml
      - scripts/on-spot-staging-migration*
      - scripts/on-spot-staging-apply.mjs
      - supabase/staging/*v076_on_spot_social_privacy.sql
  push:
    branches: [work/v076-on-spot-plus-stage1-20261105]
    paths: [.github/on-spot-staging-migration.request]

permissions:
  contents: read

concurrency:
  group: zapruda-on-spot-staging-migration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test scripts/on-spot-staging-migration.test.mjs

  apply:
    if: github.event_name == 'push' && github.repository == 'SergeyGalkin91/zapruda1' && github.ref == 'refs/heads/work/v076-on-spot-plus-stage1-20261105'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging-on-spot-migration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Apply one guarded transaction and read back STAGING
        env:
          ZAPRUDA_STAGING_MIGRATION_TOKEN: ${{ secrets.ZAPRUDA_STAGING_MIGRATION_TOKEN }}
        run: node scripts/on-spot-staging-migration.mjs
