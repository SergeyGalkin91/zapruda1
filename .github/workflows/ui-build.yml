name: ZAPRUDA Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun (matches Dockerfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Runtime versions
        run: bun --version
      - name: Install dependencies from Bun lockfile
        run: bun install --no-frozen-lockfile
      - name: Build frontend
        env:
          NITRO_PRESET: node-server
        run: bun run build
