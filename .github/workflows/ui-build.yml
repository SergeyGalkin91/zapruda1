name: ZAPRUDA Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun (matches Dockerfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Runtime versions
        run: bun --version
      - name: Install dependencies from Bun lockfile
        run: bun install --no-frozen-lockfile
      - name: Build frontend (CI only)
        shell: bash
        env:
          NITRO_PRESET: node-server
          # Compile-only public placeholders; never used for deployment.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build-output.log
          test -f .output/server/index.mjs
      - name: Install browser for mobile smoke test
        run: |
          bun add --dev playwright
          bunx playwright install --with-deps chromium
      - name: Start application and check mobile screens
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          set -euo pipefail
          mkdir -p mobile-check
          node .output/server/index.mjs > mobile-check/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Application server exited before it became ready"
              cat mobile-check/server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Application server did not become ready"
            cat mobile-check/server.log
            exit 1
          fi
          cat > mobile-check/check.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const routes = ['/', '/auth', '/communities', '/partners', '/chat', '/profile', '/reports/new', '/assistant', '/settings', '/feedback', '/atlas', '/street'];
            const widths = [320, 375, 430];
            let failures = 0;
            for (const width of widths) {
              const context = await browser.newContext({viewport: {width, height: 800}, isMobile: true, hasTouch: true});
              for (const route of routes) {
                const page = await context.newPage();
                const browserErrors = [];
                page.on('pageerror', error => browserErrors.push(error.message));
                try {
                  const response = await page.goto('http://127.0.0.1:3000' + route, {waitUntil:'domcontentloaded', timeout:20000});
                  await page.waitForSelector('nav[aria-label="Мобильная навигация"]', {state:'visible', timeout:12000});
                  await page.waitForTimeout(600);
                  const metrics = await page.evaluate(() => {
                    const nav = document.querySelector('nav[aria-label="Мобильная навигация"]');
                    const rect = nav?.getBoundingClientRect();
                    return {
                      contentWidth: document.documentElement.scrollWidth,
                      viewportWidth: document.documentElement.clientWidth,
                      main: Boolean(document.querySelector('main')),
                      navigationVisible: Boolean(rect && rect.width > 0 && rect.bottom <= innerHeight + 2 && rect.bottom > innerHeight - 110),
                      errorScreen: Boolean(document.querySelector('h1')?.textContent?.includes("This page didn't load"))
                    };
                  });
                  // Read-only core journey smoke checks: never write to production Supabase.
                  if (route === '/auth') {
                    const text = await page.locator('body').innerText();
                    if (!/войти|вход|регистрац/i.test(text)) {
                      failures++; console.error(width + 'px /auth: missing login/registration entry');
                    }
                  }
                  if (route === '/reports/new') {
                    const text = await page.locator('body').innerText();
                    if (!/новый отчёт/i.test(text) || !/название отчёта/i.test(text)) {
                      failures++; console.error(width + 'px /reports/new: report form not rendered');
                    }
                  }
                  if (route === '/street') {
                    const start = page.getByRole('button', {name: /начать сессию/i});
                    if (!await start.isVisible()) { failures++; console.error(width + 'px /street: start action missing'); }
                    else {
                      await start.click();
                      await page.getByRole('textbox', {name: /вид пойманной рыбы/i}).fill('Окунь');
                      await page.getByRole('button', {name: /добавить улов/i}).click();
                      await page.reload({waitUntil:'domcontentloaded'});
                      await page.getByText('Окунь', {exact:false}).first().waitFor({timeout:10000});
                      const count = await page.locator('body').innerText();
                      if (!/уловов за сессию:\s*1/i.test(count)) { failures++; console.error(width + 'px /street: local session not restored'); }
                      await page.getByRole('button', {name: /завершить сессию/i}).click();
                      await page.reload({waitUntil:'domcontentloaded'});
                      if (!await page.getByText('Сессия завершена').isVisible()) { failures++; console.error(width + 'px /street: completion not restored'); }
                    }
                  }
                  const ok = response && response.status() >= 200 && response.status() < 400 && metrics.main && metrics.navigationVisible && !metrics.errorScreen && browserErrors.length === 0 && metrics.contentWidth <= metrics.viewportWidth + 2;
                  console.log(width + 'px ' + route + ': ' + (ok ? 'OK' : 'FAIL') + ' status=' + (response?.status() ?? 'none') + ' ' + JSON.stringify(metrics));
                  if (browserErrors.length) console.error('Browser JS errors: ' + browserErrors.join(' | '));
                  await page.screenshot({path: 'mobile-check/' + width + '-' + (route === '/' ? 'home' : route.slice(1).replaceAll('/', '-')) + '.png', fullPage: true});
                  if (!ok) failures++;
                } catch (error) {
                  failures++;
                  console.error(width + 'px ' + route + ': ' + error.message);
                } finally { await page.close(); }
              }
              await context.close();
            }
            await browser.close();
            if (failures) process.exitCode = 1;
          })().catch(err => {console.error(err);process.exitCode=1});
          EOF
          node mobile-check/check.cjs
      - name: Check mobile navigation links and form controls
        shell: bash
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          set -euo pipefail
          node .output/server/index.mjs > mobile-check/interaction-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then break; fi
            sleep 2
          done
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport:{width:375,height:812}, isMobile:true, hasTouch:true });
            await page.goto('http://127.0.0.1:3000/', { waitUntil:'domcontentloaded' });
            const nav = page.getByRole('navigation', {name:'Мобильная навигация'});
            await nav.waitFor({state:'visible'});
            const expected = ['Лента','Создать','Выезды','Чат'];
            for (const label of expected) {
              if (await nav.getByRole('link', {name:new RegExp(label)}).count() !== 1) throw new Error('Navigation link missing: '+label);
            }
            await nav.getByRole('link', {name:/Выезды/}).click();
            await page.waitForURL('**/partners', {timeout:12000});
            const filters = await page.locator('input,select,textarea').count();
            await page.goto('http://127.0.0.1:3000/auth', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(800);
            const emailFields = await page.locator('input[type="email"]').count();
            const passwordFields = await page.locator('input[type="password"]').count();
            if (!emailFields || !passwordFields) throw new Error('Authentication form fields missing');
            const authJsErrors = [];
            page.on('pageerror', error => authJsErrors.push(error.message));
            if (authJsErrors.length) throw new Error('Authentication JS error: '+authJsErrors.join(' | '));
            console.log('Authentication form visible: email=' + emailFields + ', password=' + passwordFields);
            console.log('Mobile navigation OK; trip page inputs: '+filters);
            await page.screenshot({path:'mobile-check/navigation-interaction.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
      - name: Upload mobile screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapruda-mobile-check
          path: mobile-check/
          if-no-files-found: ignore
      - name: Save build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: build-output.log
          if-no-files-found: ignore
