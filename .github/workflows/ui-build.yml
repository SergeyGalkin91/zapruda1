name: ZAPRUDA Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update npm
        run: npm install --global npm@11
      - name: Runtime versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel verbose
      - name: Upload npm debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
      - name: Build
        run: npm run build
