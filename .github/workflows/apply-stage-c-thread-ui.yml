name: Apply Stage C thread UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/stage-c-thread-ui-20261101
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch thread UI in src/routes/chat.tsx
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          chat = Path("src/routes/chat.tsx").read_text()
          reps = [
            ('aria-label="Вернуться к списку чатов">← Все чаты</button>',
             'aria-label="Вернуться к каталогу ZAPRUDA SPOT">← ZAPRUDA SPOT</button>'),
            ('className="flex min-h-[650px] flex-col overflow-hidden rounded-[24px] border border-[#34304D] bg-[#0B1019] shadow-[0_22px_60px_rgba(0,0,0,.32)]"',
             'className="flex min-h-[min(70vh,720px)] flex-col overflow-hidden rounded-3xl border border-white/10 bg-[#070B10] shadow-[0_22px_60px_rgba(0,0,0,.32)]"'),
            ('''          <div className="border-b border-[#34304D] bg-[linear-gradient(130deg,#171729,#0B1119)] p-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 className="flex items-center gap-2 text-base font-black text-white">
                  <MessageCircle className="size-5 text-[#D7FF35]"/>
                  {selectedPlace?.name || "Вся ZAPRUDA"}
                </h2>
                <p className="mt-1 text-xs text-zinc-400">
                  {selectedPlace?.level==="city"?"Городской чат":selectedPlace?.level==="region"?"Чат региона":selectedPlace?.level==="country"?"Чат страны":"Общий чат сообщества"}
                  {" · отдельная переписка для каждого раздела"}
                </p>
              </div>
              <button type="button" onClick={() => setRefreshIndex(i=>i+1)}
                className="btn-ghost inline-flex min-h-9 items-center gap-2 px-3 text-xs"><RefreshCw className="size-4"/> Обновить</button>
            </div>''',
             '''          <div className="border-b border-white/10 bg-[linear-gradient(130deg,#171729,#0B1119)] p-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex min-w-0 items-center gap-3">
                <span className="relative flex size-14 shrink-0 items-center justify-center overflow-hidden rounded-2xl border border-white/10 bg-[#151925]" aria-hidden="true">
                  <img src={ROOM_PHOTOS[topic]} alt="" className="absolute inset-0 size-full object-cover" loading="lazy" onError={e=>{ e.currentTarget.style.display="none"; e.currentTarget.nextElementSibling?.classList.remove("hidden"); }} />
                  <span className="relative z-10 hidden text-xl text-[#D7FF35]">{currentTopic.icon}</span>
                </span>
                <div className="min-w-0">
                  <h2 className="truncate text-base font-black text-white sm:text-lg">
                    {currentTopic.label}
                  </h2>
                  <p className="mt-0.5 truncate text-xs text-[#A99AD9]">
                    {selectedPlace?.name || "Вся ZAPRUDA"}
                    {selectedPlace?.level==="city"?" · город":selectedPlace?.level==="region"?" · регион":selectedPlace?.level==="country"?" · страна":" · сообщество"}
                    {!chatLoading && messages.length>0 ? ` · ${messages.length} сообщ.` : ""}
                  </p>
                </div>
              </div>
              <button type="button" onClick={() => setRefreshIndex(i=>i+1)}
                className="btn-ghost inline-flex min-h-9 items-center gap-2 px-3 text-xs" aria-label="Обновить переписку"><RefreshCw className="size-4"/> Обновить</button>
            </div>'''),
            ('className="zapruda-chat-window min-h-[360px] flex-1 space-y-5 overflow-y-auto bg-[#0A0C16] p-3 sm:p-6"',
             'className="zapruda-chat-window min-h-[280px] flex-1 space-y-4 overflow-y-auto overscroll-contain bg-[#0A0C16] p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:p-5"'),
            ('className="space-y-3 border-t border-[#383048] bg-[#11131B] p-3 sm:p-4" onSubmit={send}',
             'className="space-y-3 border-t border-white/10 bg-[#0E1218] p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:p-4" onSubmit={send}'),
            ('className="flex flex-wrap items-center justify-between gap-3 border-t border-[#A78BFA]/20 bg-[#211B2D] px-4 py-3 text-sm text-[#DDD6FE]"',
             'className="flex flex-wrap items-center justify-between gap-3 border-t border-white/10 bg-[#171528] px-4 py-3 text-sm text-[#DDD6FE]"'),
          ]
          for old, new in reps:
              if old not in chat:
                  raise SystemExit("missing fragment: " + old[:80].replace("\n"," "))
              chat = chat.replace(old, new)
          Path("src/routes/chat.tsx").write_text(chat)
          print("stage-c patched", len(chat))
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Grok"
          git config user.email "grok@users.noreply.github.com"
          git add src/routes/chat.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(chat): Stage C ZAPRUDA SPOT thread header and mobile chrome"
          git push origin HEAD:grok/stage-c-thread-ui-20261101
