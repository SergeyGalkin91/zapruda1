name: ZAPRUDA Electric Blue cross-browser review
# Review-only browser smoke: no private keys or production Supabase access.
on:
  push:
    branches:
      - feature/issue76-electric-blue-background
      - fix/issue61-v071-p0-stages-5-8
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-appearance:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    timeout-minutes: 30
    env:
      NITRO_PRESET: node-server
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      PORT: "3000"
      HOST: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install unzip for Bun setup
        timeout-minutes: 3
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build application for isolated browser checks
        run: |
          bun run build
          test -f .output/server/index.mjs
      - name: Install the matching Playwright package
        run: bun add --dev playwright@1.58.2
      - name: Check both themes across mobile and desktop widths in three engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p appearance-evidence
          node .output/server/index.mjs > appearance-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/settings -o /dev/null; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before becoming ready"
              cat appearance-evidence/server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Server readiness timeout"
            cat appearance-evidence/server.log
            exit 1
          fi
          for engine in chromium webkit firefox; do
            echo "Checking appearance in $engine"
            VISUAL_BROWSER="$engine" node scripts/mobile-form-browser.cjs
            VISUAL_BROWSER="$engine" node scripts/visual-theme-smoke.cjs
            VISUAL_BROWSER="$engine" node scripts/premium-ui-browser.cjs
          done
          # Verify actual CSS colors; previous screenshots revealed green hardcoded surfaces.
          node scripts/issue76-no-green-audit.cjs
      - name: Upload viewport screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electric-blue-cross-browser-evidence
          path: appearance-evidence/
          if-no-files-found: ignore
          retention-days: 14
  hosted-mobile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/mobile-first-premium-20261106'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    timeout-minutes: 22
    env:
      NETLIFY_MOBILE_PREVIEW: https://deploy-preview-${{ github.event.number }}--zapruda1.netlify.app
      EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      NITRO_PRESET: node-server
      HOST: "127.0.0.1"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install unzip for Bun setup
        timeout-minutes: 3
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install application and matching Playwright package
        id: hosted-deps
        run: |
          bun install --frozen-lockfile
          bun add --dev playwright@1.58.2
      - name: Check the exact Git SHA against live STAGING and save mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PREVIEW_SHA"
          export VITE_SUPABASE_URL="$(sed -n '/^\[context.deploy-preview.environment\]/,$ s/^VITE_SUPABASE_URL = "\(.*\)"$/\1/p' netlify.toml)"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(sed -n '/^\[context.deploy-preview.environment\]/,$ s/^VITE_SUPABASE_PUBLISHABLE_KEY = "\(.*\)"$/\1/p' netlify.toml)"
          test "$VITE_SUPABASE_URL" = "https://yudtbifopfnjtjanaqrd.supabase.co"
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          bun run build
          test -f .output/server/index.mjs
          tls_dir="$(mktemp -d "$RUNNER_TEMP/mobile-staging-tls.XXXXXX")"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$tls_dir/key.pem" \
            -out "$tls_dir/cert.pem" >/dev/null 2>&1
          NITRO_SSL_CERT="$(cat "$tls_dir/cert.pem")" NITRO_SSL_KEY="$(cat "$tls_dir/key.pem")" \
            node .output/server/index.mjs > "$RUNNER_TEMP/mobile-staging.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f "$tls_dir/key.pem" "$tls_dir/cert.pem"' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:3000/settings -o /dev/null; then break; fi
            kill -0 "$SERVER_PID"
            sleep 2
          done
          curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:3000/settings -o /dev/null
          for engine in chromium webkit; do
            MOBILE_BROWSER_SCOPE=local-staging VISUAL_BROWSER="$engine" node scripts/mobile-hosted-browser.cjs
          done
      - name: Upload the live STAGING screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-first-staging-evidence
          path: appearance-evidence/mobile-staging/local-staging/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the exact Netlify STAGING SHA and test mobile screens
        if: ${{ !cancelled() && steps.hosted-deps.conclusion == 'success' }}
        run: |
          VISUAL_BROWSER=chromium node scripts/mobile-hosted-browser.cjs
          VISUAL_BROWSER=webkit node scripts/mobile-hosted-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-first-netlify-evidence
          path: appearance-evidence/mobile-staging/netlify/
          if-no-files-found: ignore
          retention-days: 14
