name: v0.7.1 Meetup mobile browser smoke
on:
  pull_request:
    paths:
      - ".github/v075-validation-request.txt"
      - "src/components/SocialMeetups.tsx"
      - "src/routes/communities.tsx"
      - "src/routes/admin*.tsx"
      - "src/routes/competitions.tsx"
      - "src/routeTree.gen.ts"
      - ".github/workflows/v071-mobile-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NITRO_PRESET: node-server
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun add --dev playwright@1.58.2
      - run: bunx playwright install --with-deps chromium
      - name: Test mobile and desktop meetup route
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/v071-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/communities >/dev/null; then break; fi
            sleep 2
          done
          node - <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            fs.mkdirSync('qa/mobile-smoke/screenshots',{recursive:true});
            const browser=await chromium.launch({headless:true});
            for(const width of [320,375,390,430,1280]){
              const page=await browser.newPage({viewport:{width,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://127.0.0.1:3000/communities',{waitUntil:'domcontentloaded'});
              if(!response||response.status()>=400)throw Error('HTTP error '+width);
              await page.getByText('СХОДКИ',{exact:true}).first().waitFor({state:'visible'});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
              if(overflow)throw Error('Horizontal overflow at '+width+'px');
              if(errors.length)throw Error('Browser errors at '+width+': '+errors.join('; '));
              await page.screenshot({path:'qa/mobile-smoke/screenshots/communities-'+width+'.png',fullPage:true});
              console.log('PASS /communities '+width+'px');
              await page.close();
            }
            // These are anonymous rendering/route checks, not authenticated RLS E2E.
            const routes=[
              {path:'/admin',heading:'Кабинет администрации'},
              {path:'/admin/operations',heading:'История операций'},
              {path:'/admin/feedback',heading:'Обращения пользователей'},
              {path:'/competitions',heading:'Командные турниры'},
            ];
            for(const width of [390,1280]){
              for(const route of routes){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.route('https://**.supabase.co/**',request=>{
                  if(new URL(request.request().url()).hostname==='sonvniuwtvzzyuglscah.supabase.co')errors.push('Unexpected production request');
                  return request.fulfill({status:503,contentType:'application/json',body:JSON.stringify({message:'Isolated anonymous rendering check'})});
                });
                const response=await page.goto('http://127.0.0.1:3000'+route.path,{waitUntil:'domcontentloaded'});
                if(!response||response.status()>=400)throw Error('HTTP error '+route.path);
                await page.getByRole('heading',{name:route.heading,exact:true}).waitFor({state:'visible'});
                if(route.path.startsWith('/admin/')){
                  if(await page.getByRole('heading',{name:'Кабинет администрации',exact:true}).count())throw Error('Admin index masked child route '+route.path);
                }
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2))throw Error('Overflow '+route.path+' '+width);
                if(errors.length)throw Error('Browser errors: '+errors.join('; '));
                await page.screenshot({path:'qa/mobile-smoke/screenshots/'+route.path.slice(1).replaceAll('/','-')+'-'+width+'.png',fullPage:true});
                console.log('PASS anonymous '+route.path+' '+width+'px');
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Validate Electric Blue palette and legacy olive regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p appearance-evidence
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > appearance-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/settings >/dev/null; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          VISUAL_BROWSER=chromium node scripts/visual-theme-smoke.cjs
      - name: Keep theme screenshots and computed-color evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v071-electric-blue-no-olive-evidence
          path: appearance-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v071-meetup-browser-screenshots
          path: qa/mobile-smoke/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
