name: v0.7.1 Live Edge JWT STAGING E2E (protected)
on:
  workflow_dispatch:
  push:
    branches: [fix/issue61-v071-p0-stages-5-8]
    paths: [.github/staging-e2e-request.txt, .github/staging-edge-e2e-request.txt]
permissions:
  contents: read
concurrency:
  group: staging-e2e-edge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  edge-real-jwt:
    if: github.ref_name == 'fix/issue61-v071-p0-stages-5-8'
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Live JWT weather and daily Grok advice
        env:
          ZAPRUDA_E2E_STAGING_URL: ${{ vars.ZAPRUDA_E2E_STAGING_URL }}
          ZAPRUDA_E2E_PUBLISHABLE_KEY: ${{ secrets.ZAPRUDA_E2E_PUBLISHABLE_KEY }}
          ZAPRUDA_E2E_OWNER_EMAIL: ${{ secrets.ZAPRUDA_E2E_OWNER_EMAIL }}
          ZAPRUDA_E2E_OWNER_PASSWORD: ${{ secrets.ZAPRUDA_E2E_OWNER_PASSWORD }}
        run: node scripts/e2e-edge-real-jwt-staging.mjs
