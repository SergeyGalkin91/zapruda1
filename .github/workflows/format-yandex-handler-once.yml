name: Format Yandex offline handler tests (one-time)
on:
  push:
    branches: [feat/ai-yandex-deepseek-staging]
    paths: [.github/workflows/format-yandex-handler-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/edge-handler-validation.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/edge-handler-validation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ai): format Yandex offline handler tests"
            git push origin HEAD:feat/ai-yandex-deepseek-staging
          fi
