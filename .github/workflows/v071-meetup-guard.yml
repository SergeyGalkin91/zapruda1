name: v0.7.1 Meetup security guards
on:
  pull_request:
    paths:
      - 'src/components/SocialMeetups.tsx'
      - 'supabase/staging/*meetup*.sql'
      - 'scripts/check-meetup-guards.mjs'
      - 'scripts/source-tokens.mjs'
      - '.github/workflows/v071-meetup-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: node scripts/check-meetup-guards.mjs
