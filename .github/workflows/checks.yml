name: ZAPRUDA checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit migration versions (block new conflicts)
        run: node scripts/check-migration-versions.mjs
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Keep generated route contracts in sync
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Tests
        run: bun run test --maxWorkers=2
