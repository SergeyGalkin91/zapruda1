name: ZAPRUDA checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-frozen-lockfile
      - name: Audit migration versions (report existing conflicts)
        run: node scripts/check-migration-versions.mjs
        continue-on-error: true
      - name: Lint (report existing issues)
        run: bun run lint
        continue-on-error: true
      - name: Build
        run: bun run build
      - name: Tests
        run: bun run test
