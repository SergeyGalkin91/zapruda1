name: ZAPRUDA offline Docker image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/docker-offline-artifact.yml"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
  workflow_dispatch:

jobs:
  export-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone image with replaceable public Supabase settings
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zapruda-community:local
          build-args: |
            VITE_SUPABASE_URL=https://sonvniuwtvzzyuglscah.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_86B9kOH2BUNOuHyYoHX4qw_FbuLHl5E
            GIT_SHA=${{ github.sha }}
      - name: Verify the production site serves complete JavaScript
        shell: bash
        run: |
          docker run --rm -d --name zapruda-smoke -p 3000:3000 zapruda-community:local
          trap 'docker rm -f zapruda-smoke >/dev/null 2>&1 || true' EXIT
          for n in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000/auth -o /tmp/zapruda-auth.html; then break; fi
            sleep 1
          done
          INDEX_FILE="$(docker exec zapruda-smoke sh -c 'find /app/.output/public/assets -maxdepth 1 -name "index-*.js" | head -n 1')"
          if [ -z "$INDEX_FILE" ]; then echo "Missing client JS asset"; exit 1; fi
          docker cp "zapruda-smoke:$INDEX_FILE" /tmp/zapruda-expected.js
          ASSET="$(basename "$INDEX_FILE")"
          curl --silent --fail --show-error "http://127.0.0.1:3000/assets/$ASSET" -o /tmp/zapruda-client.js
          cmp /tmp/zapruda-expected.js /tmp/zapruda-client.js
          node --check /tmp/zapruda-client.js
          if grep -q 'https://example.supabase.co' /tmp/zapruda-client.js; then
            echo "ERROR: Placeholder Supabase URL was compiled into the client"
            exit 1
          fi
          echo "JavaScript asset matches the built file byte-for-byte and parses."
      - name: Export Docker image as TAR
        run: docker save -o zapruda-community.tar zapruda-community:local
      - name: Make image available without Docker Hub
        uses: actions/upload-artifact@v4
        with:
          name: zapruda-community-offline
          path: zapruda-community.tar
          retention-days: 7
          compression-level: 1
