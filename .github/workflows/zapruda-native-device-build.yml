name: ZAPRUDA APP native Android and iOS build
on:
  push:
    branches: [feat/zapruda-app-native-ios-android]
    paths:
      - 'apps/zapruda-app/**'
      - '.github/workflows/zapruda-native-device-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-standalone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/zapruda-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://yudtbifopfnjtjanaqrd.supabase.co
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure public STAGING publishable key
        run: |
          key=$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY = "\(.*\)"$/\1/p' ../../netlify.toml | tail -1)
          [[ "$key" == sb_publishable_* ]] || { echo 'Reviewed STAGING publishable key missing'; exit 1; }
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable Android test APK with bundled JS
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature, application package and bundled JS
        run: |
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep "package: name='community.zapruda.app'"
      - name: Upload Android standalone test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zapruda-app-android-standalone-test-apk
          path: apps/zapruda-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/zapruda-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://yudtbifopfnjtjanaqrd.supabase.co
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify Xcode availability
        run: |
          xcodebuild -version
          swift --version
          swift -version | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)' || { echo 'Xcode Swift compiler too old for Expo 58'; exit 1; }
      - name: Configure public STAGING publishable key
        run: |
          key=$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY = "\(.*\)"$/\1/p' ../../netlify.toml | tail -1)
          [[ "$key" == sb_publishable_* ]] || { echo 'Reviewed STAGING publishable key missing'; exit 1; }
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Compile iOS Simulator application without signing
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/zapruda-ios-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone Simulator and launch native application
        run: |
          app=$(find "$RUNNER_TEMP/zapruda-ios-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and "iPhone" in x["name"]),""))')
          if [[ -z "$device" ]]; then
            echo "No available iPhone simulator on macOS runner"
            exit 1
          fi
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = "community.zapruda.app"
          xcrun simctl launch "$device" "$bundle"
          sleep 4
          mkdir -p "$RUNNER_TEMP/zapruda-native-proof"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/zapruda-native-proof/ios-iphone-home.png"
          xcrun simctl terminate "$device" "$bundle" || true
      - name: Upload iPhone Simulator screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zapruda-app-ios-simulator-screenshot
          path: ${{ runner.temp }}/zapruda-native-proof/ios-iphone-home.png
          if-no-files-found: error
          retention-days: 7
      - name: Pack iOS Simulator app
        run: |
          cd "$RUNNER_TEMP/zapruda-ios-derived/Build/Products/Release-iphonesimulator"
          test -d "$(find . -maxdepth 1 -name '*.app' -type d -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent ./*.app "$RUNNER_TEMP/zapruda-ios-simulator.zip"
      - name: Upload unsigned simulator build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zapruda-app-ios-simulator-unsigned
          path: ${{ runner.temp }}/zapruda-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
