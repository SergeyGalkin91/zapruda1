name: Independent build and lockfile preparation
on:
  pull_request:
    paths:
      - '.github/workflows/independent-lockfile-proof.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare candidate manifests without the Lovable build package
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          delete pkg.devDependencies['@lovable.dev/vite-tanstack-config'];
          pkg.version='0.7.5';
          writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          bun install --lockfile-only --ignore-scripts
          mkdir -p qa/independent-lock
          cp package.json bun.lock qa/independent-lock/
      - name: Install the generated lock and test the independent build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test --maxWorkers=2
          bun run build
          test -f .output/server/index.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          assert.equal(pkg.devDependencies['@lovable.dev/vite-tanstack-config'],undefined);
          assert.doesNotMatch(readFileSync('bun.lock','utf8'),/@lovable\.dev\//);
          writeFileSync('qa/independent-lock/proof.json',JSON.stringify({
            source:process.env.GITHUB_SHA,
            environment:'disconnected CI configuration; no deployment',
            generatedManifests:true,
            frozenInstall:true,
            types:true,lint:true,unitTests:true,nodeServerBuild:true
          },null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-lockfile-candidate
          path: qa/independent-lock/
          retention-days: 7
