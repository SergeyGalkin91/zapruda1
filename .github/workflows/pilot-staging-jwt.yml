name: Pilot reports chat profile real JWT (protected)
on:
  push:
    branches: [feat/ai-yandex-deepseek-staging]
    paths: [.github/pilot-e2e-request.txt]
permissions:
  contents: read
concurrency:
  group: pilot-staging-schema-e2e
  cancel-in-progress: false
jobs:
  real-pilot:
    runs-on: ubuntu-24.04
    environment: staging-e2e
    timeout-minutes: 40
    env:
      ZAPRUDA_E2E_STAGING_URL: ${{ vars.ZAPRUDA_E2E_STAGING_URL }}
      ZAPRUDA_E2E_PUBLISHABLE_KEY: ${{ secrets.ZAPRUDA_E2E_PUBLISHABLE_KEY }}
      ZAPRUDA_E2E_OWNER_EMAIL: ${{ secrets.ZAPRUDA_E2E_OWNER_EMAIL }}
      ZAPRUDA_E2E_OWNER_PASSWORD: ${{ secrets.ZAPRUDA_E2E_OWNER_PASSWORD }}
      ZAPRUDA_E2E_SEATED_EMAIL: ${{ secrets.ZAPRUDA_E2E_SEATED_EMAIL }}
      ZAPRUDA_E2E_SEATED_PASSWORD: ${{ secrets.ZAPRUDA_E2E_SEATED_PASSWORD }}
      ZAPRUDA_E2E_RACER_A_EMAIL: ${{ secrets.ZAPRUDA_E2E_RACER_A_EMAIL }}
      ZAPRUDA_E2E_RACER_A_PASSWORD: ${{ secrets.ZAPRUDA_E2E_RACER_A_PASSWORD }}
      ZAPRUDA_E2E_RACER_B_EMAIL: ${{ secrets.ZAPRUDA_E2E_RACER_B_EMAIL }}
      ZAPRUDA_E2E_RACER_B_PASSWORD: ${{ secrets.ZAPRUDA_E2E_RACER_B_PASSWORD }}
      ZAPRUDA_SPOT_E2E_UPLOAD_PROBE: "true"
      ZAPRUDA_FEEDBACK_E2E_TELEGRAM_DISABLED: "readback-no-outbound-code"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Actual API transactions visibility media and cleanup
        run: node scripts/e2e/pilot-schema-live.mjs
      - name: Real JWT feedback save history privacy and concurrent limit
        if: ${{ !cancelled() }}
        run: node scripts/e2e/feedback-live.mjs
      - name: Independent real SPOT JWT boundaries and rejected upload
        if: ${{ !cancelled() }}
        run: node scripts/e2e/spot-v075-live.mjs
      - name: Build real-STAGING browser frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.ZAPRUDA_E2E_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZAPRUDA_E2E_PUBLISHABLE_KEY }}
          NITRO_PRESET: node-server
        run: bun run build
      - name: Install browser test engines
        run: |
          bun add --dev playwright
          bunx playwright install --with-deps chromium firefox webkit
      - name: Real authenticated browser journeys and screenshots
        run: |
          node .output/server/index.mjs > /tmp/authenticated-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/auth -o /dev/null; then break; fi
            sleep 2
          done
          node scripts/e2e/authenticated-browser-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-real-JWT-safe-result
          path: |
            qa/pilot-safe/
            qa/v075-safe/
            qa/authenticated-browser/
          retention-days: 7
