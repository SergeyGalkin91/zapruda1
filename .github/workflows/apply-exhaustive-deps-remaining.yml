name: Apply exhaustive-deps remaining patches

on:
  push:
    branches:
      - grok/fix-exhaustive-deps-20261101
    paths:
      - scripts/trigger-exhaustive-deps-apply
      - scripts/apply_exhaustive_deps_patches.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/fix-exhaustive-deps-20261101
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release base
        run: git fetch origin release/v0.7.0-alpha:refs/remotes/origin/release/v0.7.0-alpha

      - name: Apply patches
        run: python3 scripts/apply_exhaustive_deps_patches.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Grok"
          git config user.email "grok@users.noreply.github.com"
          git add \
            src/components/AnglerGearSets.tsx \
            src/components/PrivateFishingMarks.tsx \
            src/routes/auth.tsx \
            src/routes/index.tsx \
            src/routes/chat.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(hooks): complete exhaustive-deps patches (auth, feed, chat, gear, marks)"
          git push origin HEAD:grok/fix-exhaustive-deps-20261101
