name: Apply exhaustive-deps remaining patches

on:
  push:
    branches:
      - grok/fix-exhaustive-deps-20261101
    paths:
      - "scripts/trigger-exhaustive-deps-apply"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/fix-exhaustive-deps-20261101
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release base
        run: git fetch origin release/v0.7.0-alpha:refs/remotes/origin/release/v0.7.0-alpha

      - name: Restore and patch files
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def show(path, ref="origin/release/v0.7.0-alpha"):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          # Restore gear from release if placeholder
          gear_path = Path("src/components/AnglerGearSets.tsx")
          gear = gear_path.read_text()
          if "PLACEHOLDER" in gear or len(gear) < 500:
              gear = show("src/components/AnglerGearSets.tsx")
          gear = gear.replace(
              "}, [items, selectedRod, selectedReel, selectedLine]);",
              "}, [items, rods, reels, lines, selectedRod, selectedReel, selectedLine]);",
          )
          gear_path.write_text(gear)
          print("gear ok", "rods, reels, lines" in gear)

          # auth
          p = Path("src/routes/auth.tsx")
          t = p.read_text()
          old = """    return () => { active = false; subscription.unsubscribe(); };
  }, []);

  useEffect(() => {
    if (mode === \"in\" || mode === \"up\") setMode(search.mode);
  }, [search.mode]);
"""
          new = """    return () => { active = false; subscription.unsubscribe(); };
  }, [navigate]);

  useEffect(() => {
    // Sync URL mode only while user is on in/up forms (not forgot/recovery).
    setMode((current) => (current === \"in\" || current === \"up\" ? search.mode : current));
  }, [search.mode]);
"""
          if old in t:
              t = t.replace(old, new)
              p.write_text(t)
              print("auth patched")
          elif "}, [navigate]);" in t:
              print("auth already")
          else:
              t = show("src/routes/auth.tsx")
              if old not in t:
                  raise SystemExit("auth pattern missing on release")
              p.write_text(t.replace(old, new))
              print("auth restored+patched")

          # marks
          p = Path("src/components/PrivateFishingMarks.tsx")
          t = p.read_text()
          if "const refresh = useCallback" not in t:
              if "PLACEHOLDER" in t or len(t) < 200:
                  t = show("src/components/PrivateFishingMarks.tsx")
              if "useCallback" not in t:
                  t = t.replace(
                      'import { useEffect, useState } from "react";',
                      'import { useCallback, useEffect, useState } from "react";',
                  )
              t = t.replace(
          """  async function refresh() {
    const { data, error: queryError } = await supabase.from("private_fishing_marks")
      .select("id,kind,title,note,latitude,longitude,created_at")
      .eq("user_id", userId).order("created_at", { ascending: false }).limit(100);
    if (queryError) setError("Не удалось загрузить личные метки: " + queryError.message);
    else setMarks((data ?? []) as Mark[]);
    setLoading(false);
  }

  useEffect(() => { void refresh(); }, [userId]);
""",
          """  const refresh = useCallback(async () => {
    const { data, error: queryError } = await supabase.from("private_fishing_marks")
      .select("id,kind,title,note,latitude,longitude,created_at")
      .eq("user_id", userId).order("created_at", { ascending: false }).limit(100);
    if (queryError) setError("Не удалось загрузить личные метки: " + queryError.message);
    else setMarks((data ?? []) as Mark[]);
    setLoading(false);
  }, [userId]);

  useEffect(() => { void refresh(); }, [refresh]);
""")
              p.write_text(t)
              print("marks patched")
          else:
              print("marks already")

          # index
          p = Path("src/routes/index.tsx")
          t = p.read_text()
          old = """  }, [hasMore, loadingMore, reports.length]);

  useEffect(() => { void loadPage(true); }, []);
"""
          new = """  }, [hasMore, loadingMore, reports.length]);

  const loadPageRef = useRef(loadPage);
  loadPageRef.current = loadPage;

  // One-shot initial fetch; infinite scroll / realtime use loadPage via deps below.
  useEffect(() => { void loadPageRef.current(true); }, []);
"""
          if "loadPageRef" in t:
              print("index already")
          elif old in t:
              p.write_text(t.replace(old, new))
              print("index patched")
          else:
              t = show("src/routes/index.tsx")
              if old not in t:
                  raise SystemExit("index pattern missing")
              p.write_text(t.replace(old, new))
              print("index restored+patched")

          # chat
          p = Path("src/routes/chat.tsx")
          t = p.read_text()
          if "if (!uid || !placeId || !threadOpen) return;" in t and "[uid, placeId, topic, refreshIndex, threadOpen]" in t:
              print("chat already")
          else:
              if "PLACEHOLDER" in t or len(t) < 500:
                  t = show("src/routes/chat.tsx")
              t = t.replace(
          """  useEffect(() => {
    if (!uid || !selectedPlace || !threadOpen) return;
""",
          """  useEffect(() => {
    if (!uid || !placeId || !threadOpen) return;
""")
              t = t.replace('.eq("place_id", selectedPlace.id).eq("topic", topic)', '.eq("place_id", placeId).eq("topic", topic)')
              t = t.replace(
                  'const channel = supabase.channel("zapruda-chat-" + selectedPlace.id + "-" + topic)',
                  'const channel = supabase.channel("zapruda-chat-" + placeId + "-" + topic)',
              )
              t = t.replace('filter: "place_id=eq." + selectedPlace.id,', 'filter: "place_id=eq." + placeId,')
              t = t.replace(
                  '}, [uid, selectedPlace?.id, topic, refreshIndex, threadOpen]);',
                  '}, [uid, placeId, topic, refreshIndex, threadOpen]);',
              )
              if "if (!uid || !placeId || !threadOpen) return;" not in t:
                  raise SystemExit("chat patch failed")
              p.write_text(t)
              print("chat patched")

          print("ALL PATCHES DONE")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Grok"
          git config user.email "grok@users.noreply.github.com"
          git add \
            src/components/AnglerGearSets.tsx \
            src/components/PrivateFishingMarks.tsx \
            src/routes/auth.tsx \
            src/routes/index.tsx \
            src/routes/chat.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(hooks): complete exhaustive-deps patches (auth, feed, chat, gear, marks)"
          git push origin HEAD:grok/fix-exhaustive-deps-20261101
