name: Cloudflare beta lockfile and build
on:
  push:
    branches: [deploy/cloudflare-beta]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Synchronize Bun lockfile
        run: bun install --no-frozen-lockfile
      - name: Commit updated lockfile to beta branch
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync cloudflare beta bun lockfile"
            git push origin HEAD:deploy/cloudflare-beta
          fi
      - name: Validate Cloudflare build
        run: bun run build:cloudflare
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
