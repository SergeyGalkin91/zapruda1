name: Cloudflare beta build
on:
  push:
    branches: [deploy/cloudflare-beta]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/cloudflare-beta
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Synchronize Bun dependencies
        run: bun install --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync bun.lock for Cloudflare"
            git push origin HEAD:deploy/cloudflare-beta
          fi
      - name: Validate Workers build
        run: bun run build:cloudflare
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
