name: Report photo privacy browser check
on:
  pull_request:
    paths:
      - ".github/v075-validation-request.txt"
      - "src/lib/report-photo*"
      - "src/test/fixtures/report-photo*"
      - "scripts/check-report-photo-browser.mjs"
      - ".github/workflows/report-photo-privacy.yml"
permissions:
  contents: read
jobs:
  conversion:
    # Playwright 1.58.2 supports this image; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      PHOTO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun add --dev playwright@1.58.2
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Check real browser JPEG conversion and EXIF orientation
        shell: bash
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 4189 > /tmp/report-photo-vite.log 2>&1 &
          PHOTO_SERVER_PID=$!
          trap 'kill "$PHOTO_SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4189/src/lib/report-photo.ts >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          node scripts/check-report-photo-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-photo-privacy-${{ matrix.browser }}
          path: qa/report-privacy/*.json
          if-no-files-found: ignore
          retention-days: 7
