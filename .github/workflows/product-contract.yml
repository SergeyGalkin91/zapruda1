name: Product contract integrity (not release approval)
on:
  pull_request:
  push:
    branches: [docs/zapruda-canonical-decisions-20261104, feat/ai-yandex-deepseek-staging]
permissions:
  contents: read
jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate immutable feature baseline and links
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-product-contract.mjs
      - name: Contract regression tests
        run: node --test scripts/check-product-contract.test.mjs
      - name: Keep registered routes and static transitions in sync
        run: |
          node scripts/check-route-graph.mjs
          PRODUCT_CODE_SHA=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("docs/ZAPRUDA_FEATURES.json","utf8")).source_sha)')
          node scripts/inventory-screen-transitions.mjs "$PRODUCT_CODE_SHA"
          git diff --exit-code -- docs/ZAPRUDA_SCREEN_TRANSITIONS_20261105.md qa/architecture-20261105/screen-transitions.json
