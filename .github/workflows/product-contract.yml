name: Product contract integrity (not release approval)
on:
  pull_request:
  push:
    branches: [docs/zapruda-canonical-decisions-20261104, feat/ai-yandex-deepseek-staging]
permissions:
  contents: read
jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate immutable feature baseline and links
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-product-contract.mjs
      - name: Contract regression tests
        run: node --test scripts/check-product-contract.test.mjs
