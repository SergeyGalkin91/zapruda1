name: ZAPRUDA APP native source checks
on:
  push:
    branches: [feat/zapruda-app-native-ios-android]
    paths:
      - 'apps/zapruda-app/**'
      - '.github/workflows/zapruda-native-check.yml'
  pull_request:
    paths:
      - 'apps/zapruda-app/**'
      - '.github/workflows/zapruda-native-check.yml'
permissions:
  contents: read
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/zapruda-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install isolated native dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck native app
        run: npm run check
      - name: Expo config validation
        run: npx expo config --type public
      - name: Android JS bundle export
        run: npx expo export --platform android --output-dir dist-native-test
      - name: iOS JS bundle export
        run: npx expo export --platform ios --output-dir dist-native-test-ios
