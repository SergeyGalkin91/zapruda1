name: Apply stage6 competitions UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/stage6-team-competitions

      - name: Decode UI payloads
        run: |
          python3 <<'PY'
          import zlib, base64
          from pathlib import Path

          def write(path, payload_path):
              payload = Path(payload_path).read_text().strip()
              data = zlib.decompress(base64.b64decode(payload))
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)
              print(path, len(data))

          write("src/routes/competitions.tsx", ".github/payloads/stage6/competitions.min.z64")
          write("src/routes/communities.tsx", ".github/payloads/stage6/communities.min.z64")
          write("src/routeTree.gen.ts", ".github/payloads/stage6/routeTree.min.z64")
          PY

      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run test

      - name: Commit
        run: |
          git config user.name Grok
          git config user.email grok@users.noreply.github.com
          git add src/routes/competitions.tsx src/routes/communities.tsx src/routeTree.gen.ts
          git diff --cached --quiet || git commit -m "feat(stage6): competitions UI + communities entry + routes"
          git push origin HEAD:grok/stage6-team-competitions
