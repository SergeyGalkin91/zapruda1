name: Pilot schema PostgreSQL and Deno checks
on:
  pull_request:
    paths:
      - ".github/v075-validation-request.txt"
      - "supabase/staging/v075_*"
      - "supabase/staging/v076_club_message_membership_scope.sql"
      - "supabase/staging/v076_meetup_leave_cancel.sql"
      - "supabase/tests/unit/club_message_context.sql"
      - "supabase/staging/rollback_v075_pilot_schema.sql"
      - "supabase/tests/unit/*dependencies*"
      - "supabase/functions/chat-photo-*/**"
      - "scripts/check-pilot-postgres.mjs"
      - "scripts/check-community-postgres.mjs"
      - "scripts/e2e/pilot-schema-live.mjs"
      - ".github/workflows/pilot-schema-postgres.yml"
permissions:
  contents: read
jobs:
  schema-and-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pilot_schema_unit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pilot_schema_unit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolated SQL transactions, rollback and reapply
        env:
          PILOT_SQL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pilot_schema_unit
        run: node scripts/check-pilot-postgres.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck both actual chat photo entrypoints
        run: deno check --node-modules-dir=auto supabase/functions/chat-photo-upload/index.ts supabase/functions/chat-photo-access/index.ts supabase/staging/functions/submit-community-request/index.ts
      - run: node --check scripts/e2e/pilot-schema-live.mjs
      - run: node --check scripts/e2e/feedback-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-schema-postgres-proof
          path: qa/pilot-postgres.json
          retention-days: 7
