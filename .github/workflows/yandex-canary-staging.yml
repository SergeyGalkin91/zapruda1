name: Yandex DeepSeek and YandexGPT real JWT canary (protected)
on:
  push:
    branches: [feat/ai-yandex-deepseek-staging]
    paths: [.github/yandex-e2e-request.txt]
permissions:
  contents: read
concurrency:
  group: yandex-staging-canary
  cancel-in-progress: false
jobs:
  real-yandex:
    runs-on: ubuntu-24.04
    environment: staging-e2e
    timeout-minutes: 8
    env:
      ZAPRUDA_E2E_STAGING_URL: ${{ vars.ZAPRUDA_E2E_STAGING_URL }}
      ZAPRUDA_E2E_PUBLISHABLE_KEY: ${{ secrets.ZAPRUDA_E2E_PUBLISHABLE_KEY }}
      ZAPRUDA_E2E_OWNER_EMAIL: ${{ secrets.ZAPRUDA_E2E_OWNER_EMAIL }}
      ZAPRUDA_E2E_OWNER_PASSWORD: ${{ secrets.ZAPRUDA_E2E_OWNER_PASSWORD }}
      ZAPRUDA_E2E_SEATED_EMAIL: ${{ secrets.ZAPRUDA_E2E_SEATED_EMAIL }}
      ZAPRUDA_E2E_SEATED_PASSWORD: ${{ secrets.ZAPRUDA_E2E_SEATED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Real DeepSeek, backup model, quotas, privacy and OpenWeather
        run: node scripts/e2e/yandex-canary-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yandex-canary-safe-result
          path: qa/yandex-safe/
          retention-days: 7
