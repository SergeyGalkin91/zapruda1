name: Format Yandex AI migration (one-time)
on:
  push:
    branches:
      - feat/ai-yandex-deepseek-staging
    paths:
      - .github/workflows/format-yandex-ai-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Format only new AI migration files
        run: |
          bunx prettier --write supabase/functions/zapruda-daily-advice/index.ts supabase/functions/zapruda-daily-advice/yandex-provider.ts src/lib/yandex-ai-provider.test.ts
      - name: Commit formatting on isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/zapruda-daily-advice/index.ts supabase/functions/zapruda-daily-advice/yandex-provider.ts src/lib/yandex-ai-provider.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ai): format Yandex migration with repository Prettier"
            git push origin HEAD:feat/ai-yandex-deepseek-staging
          fi
